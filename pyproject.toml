[project]
name = "vox-clone-pipeline"
version = "0.1.0"
description = "A clean, modular Streamlit app for local zero-shot TTS voice cloning (macOS CPU-only)"
authors = [
    {name = "EngineerNV"}
]
readme = "README.md"
requires-python = ">=3.10,<3.13"  # chatterbox-tts needs >=3.10
license = {text = "MIT"}

[project.urls]
Homepage = "https://github.com/EngineerNV/vox-clone-pipeline"
Repository = "https://github.com/EngineerNV/vox-clone-pipeline"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["audio", "tts", "services", "app", "core"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_calls = false
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "TTS.*",
    "noisereduce.*",
    "pydub.*",
    "librosa.*",
    "soundfile.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]
